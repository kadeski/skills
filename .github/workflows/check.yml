name: check

# Runs scripts/check.sh on every push and PR. The pre-push hook is off in a fresh
# clone (core.hooksPath is per clone), so this is the copy that always runs.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: npm install -g @anthropic-ai/claude-code
      - run: bash scripts/check.sh
