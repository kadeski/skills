schema_version: "1.1"
name: unindexed-doc
description: "A doc in docs/ is missing from an index that claims to list every doc, and a backticked source path points at a file that was moved. Other backticks are commands, flags and env vars, and the other paths exist."
tags: [doc-lint-train]
execution:
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: "/doc-lint:doc-lint"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
