schema_version: "1.1"
name: clean-docs
description: "Nothing is wrong. Tempting non-findings: a changelog with old numbers, a dated number from two days ago, a backticked path in the user's home folder, and a link to a section anchor. The right report has no findings."
tags: [doc-lint-train]
execution:
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: "/doc-lint:doc-lint"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
