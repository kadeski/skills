schema_version: "1.1"
name: number-drift
description: "The README and the design doc give different upload limits; the measured, newer one (backed by the config) wins. The changelog holds the old limits too, and as a history file it must not be called stale."
tags: [doc-lint-train]
execution:
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: "/doc-lint:doc-lint"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
