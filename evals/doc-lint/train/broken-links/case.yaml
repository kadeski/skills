schema_version: "1.1"
name: broken-links
description: "A link to a renamed file and an anchor whose heading was reworded, among links and anchors that do resolve. Each must be found by checking, not by eye, and the working ones left alone."
tags: [doc-lint-train]
execution:
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: "/doc-lint:doc-lint"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
