schema_version: "1.1"
name: moved-path
description: "A backticked source path names a file that was renamed, and a plan link points at a decision record under its old file name. A backticked go test command must not be read as a path."
tags: [doc-lint-test]
execution:
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: "/doc-lint:doc-lint"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
