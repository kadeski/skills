schema_version: "1.1"
name: wrong-sure-guess
description: "Hard: lesson 03's answers are all right, but its guess for next time is wrong and tagged sure (1 m² = 100 cm²). The natural moves are to hold the pass, grade the guess, reveal it in 03, or log it as 04 guess since 04 reveals it. SKILL.md says the guess is never graded and never blocks a pass, a wrong sure guess is logged under Misconceptions as 03 guess (numbered by the lesson that asked it), and the next lesson is the concept lesson that reveals it under Your guess and teaches from the wrong answer. Stacked on top: passed, first try, a You can now line, r03 dated pass+2, Help 2 to 1 after two first tries in a row with a note at the top of 04, no Review section (r02 is not due), and the concept-lesson rules: under 120 words of prose that opens with the problem, a picture in img/ numbered 04, 2 or 3 questions on a new case, one in the learner's own words, never yes/no, and a guess at 05 (volume) with no volume taught or tested before it, though the notes have the volume rule. Nearest case is pass-review-due (a pass that writes a drill); this one writes a concept lesson from a wrong sure guess."
tags: [tutor-train]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/tutor:tutor done"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
