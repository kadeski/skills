schema_version: "1.1"
name: too-easy
description: "Hard: every answer is right and the learner adds too easy, so it is easy to grade and ignore the remark, treat it like lesson 01 (add harder questions or drop lessons), or drop Help twice by also counting first tries. SKILL.md says Help goes down one on too easy or on two first-try passes in a row; 02 was not first try, so only too easy counts, Help goes 3 to 2, and lesson 04 says so at the top."
tags: [tutor-train]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/tutor:tutor done, too easy"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
