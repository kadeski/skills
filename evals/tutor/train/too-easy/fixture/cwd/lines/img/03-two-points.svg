<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240">
  <rect width="360" height="240" fill="white"/>
  <g stroke="#222" stroke-width="2" fill="none">
    <line x1="60" y1="190" x2="220" y2="30"/>
    <line x1="60" y1="190" x2="220" y2="190" stroke-dasharray="6 4"/>
    <line x1="220" y1="190" x2="220" y2="30" stroke-dasharray="6 4"/>
  </g>
  <circle cx="60" cy="190" r="5" fill="#111"/>
  <circle cx="220" cy="30" r="5" fill="#111"/>
  <g font-size="16" fill="#111">
    <text x="20" y="215">(1, 3)</text>
    <text x="230" y="35">(5, 11)</text>
    <text x="90" y="212">run: 5 - 1 = 4</text>
    <text x="228" y="115">rise:</text>
    <text x="228" y="135">11 - 3 = 8</text>
  </g>
</svg>
