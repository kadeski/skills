schema_version: "1.1"
name: blanks-no-done
description: "Hard: the learner checks in with a blank answer and never says done. The tutor must ask in one line and change nothing, though grading the filled answers is tempting."
tags: [tutor-train]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/kadeski-skills:tutor"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
