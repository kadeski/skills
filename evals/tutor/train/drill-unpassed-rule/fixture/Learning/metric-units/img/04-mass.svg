<svg xmlns="http://www.w3.org/2000/svg" width="360" height="170" viewBox="0 0 360 170">
  <rect width="360" height="170" fill="white"/>
  <g font-family="sans-serif" font-size="18" fill="#111">
    <text x="30" y="40">1 kg</text><text x="150" y="40">= 1000 g</text>
    <text x="30" y="90">1 g</text><text x="150" y="90">= 1000 mg</text>
    <text x="30" y="140">milli</text><text x="150" y="140">= one thousandth</text>
  </g>
  <g stroke="#222" stroke-width="2">
    <line x1="20" y1="58" x2="340" y2="58"/><line x1="20" y1="108" x2="340" y2="108"/>
  </g>
</svg>
