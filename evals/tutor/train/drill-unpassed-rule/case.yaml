schema_version: "1.1"
name: drill-unpassed-rule
description: "Hard: lesson 05 passes and the next planned lesson is a drill, so one run must grade and then write under many SKILL.md rules at once. Grading: Q2 is right but tagged guess, so 05 is passed but not first try and Help stays 2 even though 04 was first try; the two review answers are wrong in different ways: R1 (6 x 100 = 60) is plainly a slip, so the feedback points at the step and asks one question without giving 600, and nothing is logged; R2 (720 cm is 72,000 m, 'you times by 100', sure) is a wrong model, so the feedback shows where it breaks, asks one question without giving 7.2, and it is logged; both rules go back to 1 day. Writing: the drill needs a table or picture of the rules with no item worked, due reviews first under Review (only r04: r02 and r03 were due but were just answered and moved to tomorrow, and r05 is new), 5 or 6 mc or number items, the first reusing lesson 05's 2.5 km example, mc options of one shape with no reasoning and a varied right letter, and only rules from passed lessons: the notes also hold area and volume units (points 6 and 7) that no passed lesson taught. Since the next lesson, 07 Area units, teaches a new idea, the drill must still end with a guess at it, so area belongs in the guess and nowhere else. Adds over train/pass-review-due: an unpassed rule sitting in the notes, a drill that is not the last lesson, a slip and a wrong model in the graded lesson's review answers, a guess tag that blocks first try, and per-item checks on options."
tags: [tutor-train]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/kadeski-skills:tutor done"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
