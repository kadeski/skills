schema_version: "1.1"
name: redo-round
description: "Hard: the second round on lesson 03, which was not passed. The learner sends both redos in the chat with done: Q3, a gap last time, is now right; Q2, a logged wrong model, repeats the old answer word for word. SKILL.md says a redo that repeats the old answer is a second miss: teach it with a worked example on different numbers and raise Help one (2 to 3), without working 24 / 4 x 2 itself. Each redo goes under the old feedback as a new answer, word for word, with a new feedback quote under it, and the old answer and feedback stay as they are; the Q2 quote holds a * (the learner wrote 4*2), so it must sit in a code span, not quotation marks. Q3 is now right and leaves the plan status, which names only Q2, so nothing passes and no lesson is written. Q1, right last time, gets no new feedback. r02 is due today, but no lesson file is written and 03 is not the last lesson, so no review file and r02 stays as it is. Learner.md, added after the first round, asks for every worked example as a table with a what happened column, one row per step, and SKILL.md says Learner.md wins over the defaults, so the worked example must be that table (inside or right after the quote). Only one redo is wrong, since SKILL.md does not say whether two second misses raise Help once or twice. Over test/second-miss, which has one redo that repeats a logged misconception in new words, this one has two redos with different outcomes, the repeated-answer form of a second miss, the code-span quote rule, a Learner.md format for the worked example, a status that must shrink, and a due rule that must be left alone."
tags: [tutor-train]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/tutor:tutor 2 again: nothing, 4*2 comes first since multiply goes before divide, so it is 24/8 = 3 (sure)\n3 again: 40 / 2 = 20, then 20 / 2 = 10\ndone"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
