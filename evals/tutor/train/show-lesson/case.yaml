schema_version: "1.1"
name: show-lesson
description: "Hard: the only case where the host can draw lessons in the chat, so the `show_lesson` tool is available. Every answer of lesson 03 is right, so the run grades it as passed and writes lesson 04. SKILL.md says to call `show_lesson` once for each page graded or written, graded first, with its absolute path, and still to give the `file://` path. The pull is to call it once, for the new lesson only, to pass a relative path, or to drop the `file://` line because the panel shows the page."
tags: [tutor-train]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/tutor:tutor 1: 14 sure\n2: x and / share a rank, so you go from the left: 24/4 = 6, then 6 x 2 = 12 (sure)\n3: 10 sure\ng: b\ndone"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
