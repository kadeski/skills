schema_version: "1.1"
name: wrong-model
description: "Hard: a confident wrong answer tempts the tutor to give the fix. It must show where the idea breaks, ask one question, log it, and hold the lesson for a redo."
tags: [tutor-train]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/kadeski-skills:tutor done"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
