schema_version: "1.1"
name: chat-answers-partial
description: "Hard: the learner answers Q2 and the guess of lesson 03 in the chat, leaves Q1 and Q3 blank and never says done. SKILL.md says to copy the chat answers into their questions' sections word for word, then, with blanks and no done, ask in one line. The pull is either to grade Q2 since it is plainly right, or to change nothing at all since nothing is graded. Only the lesson file may change: goal.md stays as it is, and no feedback is written."
tags: [tutor-train]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/tutor:tutor g: b\n2: Jo multiplied first, but x and / share a rank so you go from the left: 24/4 = 6, then 6 x 2 = 12 (sure)"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
