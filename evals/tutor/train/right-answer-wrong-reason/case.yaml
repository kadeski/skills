schema_version: "1.1"
name: right-answer-wrong-reason
description: "Hard: Q2 asks which is bigger and why in the learner's own words, and the learner names the right one, the mean, for a wrong reason: the mean is always bigger than the median. The natural move is to mark it right for the right conclusion. But the question asks for the reason, and SKILL.md's concept lessons ask the learner to explain why it works, so a wrong reason tagged sure is a wrong model: show where it breaks, ask one question, log it under Misconceptions, and hold the lesson for a redo."
tags: [tutor-train]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/tutor:tutor done"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
