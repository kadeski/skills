schema_version: "1.1"
name: review-grading
description: "Hard: three review answers need three spacing rules: doubling clamped to the day before the exam, a wrong answer reset to 1 day and logged, and a right answer at gap 16 marked learned."
tags: [tutor-train]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/tutor:tutor done"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
