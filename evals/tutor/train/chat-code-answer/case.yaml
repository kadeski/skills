schema_version: "1.1"
name: chat-code-answer
description: "Hard: the learner answers all of lesson 02 in the chat and says done, and the Q2 answer is a fenced code block holding *, _ and |. SKILL.md says each chat answer goes into the page as a pre answer, word for word with its tag. The pull is to escape the markdown characters, fold the code into one line, tidy it, or keep only the first line since it alone answers the question. Both lines are right (notes 2 and 4), so the lesson passes first try: the plan says passed, first try, and lesson 03 is written."
tags: [tutor-train]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/tutor:tutor 1: blue is in both, and a set keeps each value once (sure)\n2:\n```python\nall_tags = tags_a | tags_b\nsame_tags = {*tags_a, *tags_b}  # also works\n```\nsure\n3: & only keeps the shared values, so it can never be bigger than |, which keeps all of them\ng: a\ndone"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
