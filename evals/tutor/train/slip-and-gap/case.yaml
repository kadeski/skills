schema_version: "1.1"
name: slip-and-gap
description: "Hard: two different misses in one file. A slip gets a pointer to the step, a blank gets the missing piece taught on a different example, and neither may hand over the answer."
tags: [tutor-train]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/tutor:tutor done"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
