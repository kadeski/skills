<svg xmlns="http://www.w3.org/2000/svg" width="380" height="170" viewBox="0 0 380 170">
  <rect width="380" height="170" fill="white"/>
  <text x="20" y="28" font-size="16" fill="#111">start 200, 5% simple</text>
  <rect x="20" y="50" width="80" height="40" fill="#9cc" stroke="#222"/>
  <text x="38" y="76" font-size="16" fill="#111">year 1</text>
  <rect x="110" y="50" width="80" height="40" fill="#9cc" stroke="#222"/>
  <text x="128" y="76" font-size="16" fill="#111">year 2</text>
  <rect x="200" y="50" width="80" height="40" fill="#9cc" stroke="#222"/>
  <text x="218" y="76" font-size="16" fill="#111">year 3</text>
  <text x="20" y="120" font-size="16" fill="#111">each year adds 10</text>
  <text x="20" y="150" font-size="16" fill="#111">10 + 10 + 10 = 30</text>
</svg>
