schema_version: "1.1"
name: second-miss
description: "Hard: the redo repeats a logged misconception. That is a second miss: a fully worked example on different numbers, the old feedback kept, and Help up one."
tags: [tutor-test]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/tutor:tutor done"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
