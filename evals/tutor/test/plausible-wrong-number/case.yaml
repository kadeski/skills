schema_version: "1.1"
name: plausible-wrong-number
description: "Hard: Q2's answer, the 26th, has the right shape and is one off, tagged sure, next to two right answers, so the natural move is to wave it through. SKILL.md passes a lesson only when every question is right, so the tutor must work out 200 = 18 + 26 x 7 itself, see that is the 27th term, and hold the lesson for a redo of Q2 without giving 27."
tags: [tutor-test]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/tutor:tutor done"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
