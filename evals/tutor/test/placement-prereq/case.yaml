schema_version: "1.1"
name: placement-prereq
description: "Hard: the learner guesses 7 squared and leaves the square root blank, so a whole prerequisite (squares and roots) is missing. Teaching it in feedback alone or logging a misconception is the natural move, but SKILL.md says a guess or blank is a gap, not a wrong model, Help goes to 3, 01 still passes, and a whole missing prerequisite adds a lesson for it, placed before the lessons that need it (prerequisites first), so that lesson is the next one written."
tags: [tutor-test]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/tutor:tutor done"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
