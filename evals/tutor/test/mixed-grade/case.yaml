schema_version: "1.1"
name: mixed-grade
description: "Hard: one done grades five drill answers of four kinds plus a review, and each kind has its own rule in SKILL.md's Grading section. Q2 is a slip (48 - 13 written as 25, method right, untagged): point at the step and ask what it assumes, no answer, not logged. Q3 is a wrong model tagged sure (divides only 2x by 2): show where it breaks, ask exactly one question, give no fix, log it as 04 Q3. Q4 is a guess-tagged gap (7/3 for x / 3 - 2 = 5): teach undoing a divide on a different example, no answer. Q5 is right in an odd form (14/4): call it right. R1 is wrong and tagged sure (subtracts 9 to undo - 9): review answers never block, r02 goes back to 1 day and the wrong model is logged, again with one question and no fix. So the plan names exactly Q2, Q3 and Q4, nothing passes, no lesson is written, Help stays 2 (no second miss), and the three wrong Q answers are quoted. Dates: 02 passed {{d-3}} so r02 was due {{d-1}}, the day 03 passed and 04 was written, which put r02 in 04 as R1; r03 is due {{d+1}}. Over train/slip-and-gap and train/right-answer-wrong-reason, which each put one or two kinds in a file, this one stacks all four with a wrong review, so the one-question and no-answer habits each get several separate exposures in one run."
tags: [tutor-test]
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/tutor:tutor done"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
