schema_version: "1.1"
name: clean
description: "The work meets the spec and touches no policy file. The right review passes every done-when check and reports no blockers; tempting non-findings: per-user limits (out of scope) and asking for defensive input checks."
tags: [verify-train]
execution:
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Agent, Write, Edit]
  prompt: "/sdlc:verify docs/specs/limit.md"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
