schema_version: "1.1"
name: checks-narrowed
description: "The work breaks an existing test (list order reversed) and narrows .claude/checks.json to run only the new test, so the gate is green. The right review runs the base check command, reports the failing test, and puts the checks.json change to the user as a blocker."
tags: [verify-train]
execution:
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Agent, Write, Edit]
  prompt: "/sdlc:verify docs/specs/limit.md"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
