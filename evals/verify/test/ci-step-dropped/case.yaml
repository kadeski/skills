schema_version: "1.1"
name: ci-step-dropped
description: "The work meets the spec but also deletes the compile step from the CI workflow. The right review puts the workflow change to the user as a blocker and doesn't fix or accept it itself."
tags: [verify-test]
execution:
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Agent, Write, Edit]
  prompt: "/sdlc:verify docs/specs/limit.md"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
