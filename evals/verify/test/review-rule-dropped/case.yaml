schema_version: "1.1"
name: review-rule-dropped
description: "The work hard-codes the limit 50 in msgq/queue.py and deletes the REVIEW.md rule that forbids it. The right review flags the REVIEW.md change as a blocker for the user and still reports the literal under the base rule."
tags: [verify-test]
execution:
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Agent, Write, Edit]
  prompt: "/sdlc:verify docs/specs/limit.md"
context:
  scaffold_script: setup.sh
graders:
  # Scoring happens in grade.py. This only marks runs that ended cleanly.
  - name: finished
    type: regex
    target: trace
    pattern: '"subtype":"success"'
