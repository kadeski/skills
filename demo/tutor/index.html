<title>Tutor Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Code+Pro:wght@400;500&display=swap">
<style>
:root {
  --bg: #f6f6f3; --card: #ffffff; --fg: #1b1c1e; --muted: #64676d; --line: #e2e2dc; --soft: #f0f2f7;
  --accent: #3155c9; --accent-fg: #ffffff; --review: #7a4cc4; --guess: #b86e06;
  --good: #1d7448; --good-bg: #eef7f1; --hint-bg: #fcf5e6;
  --sans: "Source Sans 3", system-ui, sans-serif; --mono: "Source Code Pro", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131416; --card: #1c1d20; --fg: #e9e9e6; --muted: #9b9ea4; --line: #2e3034; --soft: #25272c;
  --accent: #8aa2ff; --accent-fg: #10131c; --review: #b89aff; --guess: #f0b24a;
  --good: #72d3a1; --good-bg: #192820; --hint-bg: #2b2416; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #131416; --card: #1c1d20; --fg: #e9e9e6; --muted: #9b9ea4; --line: #2e3034; --soft: #25272c;
  --accent: #8aa2ff; --accent-fg: #10131c; --review: #b89aff; --guess: #f0b24a;
  --good: #72d3a1; --good-bg: #192820; --hint-bg: #2b2416; color-scheme: dark }

body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 var(--sans); }
.page { max-width: 44rem; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 24px; }
header h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 4px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); }
[data-tutor="status"] { margin: 0; padding: 10px 14px; border-radius: 8px; background: var(--soft); }
.side { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
@media (max-width: 560px) { .side { grid-template-columns: 1fr; } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.panel h2 { font-size: .75rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.tutor-plan, .tutor-reviews { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 4px; }
.tutor-plan-item[aria-current="page"] button { font-weight: 600; color: var(--accent); }
.tutor-plan-status { color: var(--muted); font-size: .9em; }
.tutor-review-date { display: inline-block; min-width: 3.5rem; font: 500 .85rem var(--mono); color: var(--muted); }
[data-due] .tutor-review-date { color: var(--review); }

code { font: .88em var(--mono); background: var(--soft); padding: .05em .3em; border-radius: 4px; }
.tutor-lesson h2 { font-size: .75rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 2rem 0 .6rem; }
.tutor-lesson h2:first-child { margin-top: 0; }
.tutor-lesson svg { max-width: 100%; height: auto; display: block; }
table { border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
th, td { padding: .4rem .8rem; text-align: left; border-top: 1px solid var(--line); }
th { font-size: .85rem; color: var(--muted); }
section { margin: .8rem 0; padding: 1rem 1.15rem; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; }
section[id^="R"] { border-left-color: var(--review); }
section#G { border-left-color: var(--guess); }
section > p:first-child { margin-top: 0; }

.tutor-option { border-color: var(--line); background: var(--soft); }
.tutor-option[aria-pressed="true"] { outline-color: var(--accent); background: var(--card); }
.tutor-input { border-color: var(--line); background: var(--bg); font: 1rem var(--mono); }
.answer { padding: .5rem .8rem; border-radius: 8px; background: var(--soft); }
.answer::before, .feedback::before, .hint::before { display: block; font: 600 .7rem var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.answer::before { content: "Your answer"; }
.feedback { margin: .4rem 0 0; padding: .5rem .8rem; border-radius: 8px; background: var(--good-bg); }
.feedback::before { content: "Feedback"; color: var(--good); }
.feedback > :last-child { margin-bottom: 0; }
.hint { padding: .5rem .8rem; border-radius: 8px; background: var(--hint-bg); }
.hint::before { content: "Hint"; color: var(--guess); }
.tutor-attempt:has(~ .tutor-attempt) { opacity: .6; }
.pass { padding: .8rem 1rem; border: 1px solid var(--good); border-radius: 10px; color: var(--good); font-weight: 600; }
button { font: inherit; }
.tutor-lesson button, .tutor-q-actions button, .tutor-actions button { padding: .35rem .9rem; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); cursor: pointer; }
.tutor-actions .tutor-done { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tutor-note { color: var(--muted); margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<div class="page">
  <header>
    <h1 data-tutor="title">Tutor</h1>
    <p data-tutor="goal"></p>
  </header>
  <p data-tutor="status"></p>
  <div class="side">
    <nav class="panel" aria-labelledby="plan-h"><h2 id="plan-h">Plan</h2><div data-tutor="plan"></div></nav>
    <aside class="panel" aria-labelledby="rev-h"><h2 id="rev-h">Reviews</h2><div data-tutor="reviews"></div></aside>
  </div>
  <main data-tutor="lesson"></main>
</div>
<script src="tutor.js"></script>
